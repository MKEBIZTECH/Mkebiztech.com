<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Connect with Yavohonna</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column. Portrait on top, name block, four contact actions, then a stacked list of links. */
:root {
  --bg: #F2F3F6;
  --surface: #FFFFFF;
  --fg: #15171F;
  --muted: #5A5F70;
  --line: #DDE0E8;
  --accent: #B35A12;
  --on-accent: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1117; --surface: #181B25; --fg: #F1F2F6; --muted: #A2A8BA;
    --line: #2A2E3C; --accent: #F0A04B; --on-accent: #1A1204; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1117; --surface: #181B25; --fg: #F1F2F6; --muted: #A2A8BA;
  --line: #2A2E3C; --accent: #F0A04B; --on-accent: #1A1204; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.photo { width: 100%; aspect-ratio: 4 / 4.2; object-fit: cover; object-position: 55% 40%; border-radius: 20px; display: block; max-width: 100%; }
.id h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.05; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
.id p { margin: 0; color: var(--muted); }
.id .co { color: var(--fg); font-weight: 600; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 600 1rem var(--font-body); padding: 14px 12px; border-radius: 12px; text-decoration: none;
  text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 52px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn:focus-visible, .link:focus-visible, .copy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .lab { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row .val { font-weight: 500; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.row > div { min-width: 0; }
.copy { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 600 0.85rem var(--font-body); padding: 8px 12px; border-radius: 10px; cursor: pointer; flex: none; }
h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 10px; }
.links { display: flex; flex-direction: column; gap: 8px; }
.link {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 56px;
}
.link .t { min-width: 0; }
.link .n { display: block; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.link .h { display: block; font-weight: 600; overflow-wrap: anywhere; }
.link .go { color: var(--accent); font-weight: 700; flex: none; }
.link.feature { border-color: var(--accent); }
#vcardbox { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
#vcardbox.open { display: block; }
#vcardbox p { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
#vcardbox textarea { width: 100%; height: 150px; font: 0.8rem/1.4 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: none; }
.status { min-height: 1.2em; font-size: 0.85rem; color: var(--muted); margin: 6px 0 0; }
@media (prefers-reduced-motion: no-preference) { .btn, .link { transition: transform .12s ease; } .btn:active, .link:active { transform: scale(.985); } }
</style>
